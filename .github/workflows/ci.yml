name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dependencies:
    # Fails a pull request that adds or upgrades to a package with a known vulnerability, of
    # any severity, and says which in a comment.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: low
          comment-summary-in-pr: on-failure

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - name: Build the poker engine so its API tests run
        run: cargo build --release --manifest-path ../engines/poker/Cargo.toml
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/poker
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  images:
    # Proves the arm64 images the Pi will run actually build.
    runs-on: ubuntu-24.04-arm
    needs: [api, engine, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build

  dependabot:
    # Dependabot's patch and minor updates (security fixes included) merge themselves once
    # everything above passes. Major versions can break things, so those wait for a person.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs: [dependencies, api, engine, web, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --merge "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

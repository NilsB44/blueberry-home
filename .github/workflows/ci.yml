name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - name: Build the poker engine so its API tests run
        run: cargo build --release --manifest-path ../engines/poker/Cargo.toml
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engines/poker
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  images:
    # Proves the arm64 images the Pi will run actually build.
    runs-on: ubuntu-24.04-arm
    needs: [api, engine, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

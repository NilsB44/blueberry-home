# Blueberry Home. Start with:  docker compose up -d
# Include the local language model with:  docker compose --profile llm up -d
name: hub

services:
  web:
    build: ./web
    restart: unless-stopped
    # IPv4 only, on purpose. On IPv6, Docker relays connections through its own proxy and the
    # hub would see them as coming from the Docker network, which it trusts as "home". Pinning
    # to IPv4 means a router that lets IPv6 traffic in can't slip past the home-network check.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      HUB_HOSTNAME: ${HUB_HOSTNAME:-hub.home}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      HUB_DATABASE_URL: sqlite:////srv/data/hub.db
      HUB_CONTENT_DIR: /srv/content
      HUB_COOKIE_SECURE: ${HUB_COOKIE_SECURE:-true}
      HUB_OLLAMA_URL: ${HUB_OLLAMA_URL:-http://ollama:11434}
      HUB_ASSISTANT_MODEL: ${HUB_ASSISTANT_MODEL:-qwen3:4b}
      HUB_FILES_DIR: /srv/files
      HUB_MAX_UPLOAD_MB: ${HUB_MAX_UPLOAD_MB:-8192}
      # Written weekly by scripts/pi-security-check.py into ./data/api on the Pi.
      HUB_HOST_REPORT_PATH: /srv/data/host-security.json
      # The Claude page: Claude Code's logs (mounted below) and, optionally, API key spend.
      HUB_CLAUDE_LOGS_DIR: /srv/claude
      HUB_ANTHROPIC_ADMIN_KEY: ${HUB_ANTHROPIC_ADMIN_KEY:-}
    volumes:
      - ./data/api:/srv/data
      # Shared files. On the Pi, point this at the SSD, e.g. /mnt/ssd/files:/srv/files.
      - ${HUB_FILES_PATH:-./data/files}:/srv/files
      # Claude Code's session logs, read-only. Set HUB_CLAUDE_LOGS=/home/<you>/.claude/projects.
      - ${HUB_CLAUDE_LOGS:-./data/claude-logs}:/srv/claude:ro
    # Not published: only reachable through Caddy.
    expose:
      - "8000"

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    restart: unless-stopped
    environment:
      # Keep one model loaded and unload it after 10 idle minutes to free RAM for everything else.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ./data/ollama:/root/.ollama
    expose:
      - "11434"

volumes:
  caddy_data:
  caddy_config:

id: premiers-pas
order: 1
title: Premiers pas
description: Greetings, the café, numbers and introducing yourself.
cefr: A1
lessons:
  - id: salutations
    title: Bonjour !
    intro: >-
      Use « bonjour » during the day and « bonsoir » in the evening. « Salut » is casual,
      for friends. « S'il vous plaît » is the polite please; « s'il te plaît » is for friends.
    vocab:
      - { word: bonjour, en: hello / good morning / good day }
      - { word: bonsoir, en: good evening }
      - { word: salut, en: hi / bye }
      - { word: au revoir, en: goodbye / bye }
      - { word: merci, en: thank you / thanks }
      - { word: s'il vous plaît, en: please }
      - { word: oui, en: "yes" }
      - { word: non, en: "no" }
      - { word: comment ça va, en: how are you / how is it going }
      - { word: ça va bien, en: I am fine / I am doing well / it is going well }
      - { word: et toi, en: and you }
      - { word: bonne journée, en: have a good day / have a nice day }
    exercises:
      - type: choice
        prompt: How do you say "hello"?
        options: ["Bonjour", "Merci", "Au revoir", "Oui"]
        answer: Bonjour
      - type: choice
        prompt: What does « merci » mean?
        speak: merci
        options: [thank you, please, goodbye, "yes"]
        answer: thank you
      - type: match
        pairs:
          - [bonjour, hello]
          - [merci, thank you]
          - [au revoir, goodbye]
          - [oui, "yes"]
          - [non, "no"]
      - type: listen
        text: Bonjour !
      - type: translate
        source: en
        prompt: Thank you
        answers: ["Merci"]
      - type: translate
        source: target
        prompt: Au revoir !
        answers: ["Goodbye", "Bye", "Goodbye!"]
      - type: word_bank
        prompt: Hello, how are you?
        answer: Bonjour, comment ça va ?
        also: ["Salut, comment ça va ?"]
        distractors: ["merci", "toi"]
      - type: gap
        prompt: Ça va bien, et ___ ?
        hint: I'm fine, and you?
        answers: ["toi"]
        options: ["toi", "moi", "je"]
      - type: choice
        prompt: It's 8 pm and you arrive at a dinner party. What do you say?
        options: ["Bonsoir !", "Bonne nuit !", "Au revoir !"]
        answer: Bonsoir !
      - type: translate
        source: en
        prompt: Please (polite)
        answers: ["S'il vous plaît"]
      - type: listen
        text: Comment ça va ?
      - type: translate
        source: target
        prompt: Bonne journée !
        answers: ["Have a good day", "Have a nice day", "Good day"]

  - id: au-cafe
    title: Au café
    intro: >-
      « Je voudrais » (I would like) is the polite way to order. French uses « du », « de la »
      and « de l' » for "some": du lait, du sucre, de l'eau.
    vocab:
      - { word: un café, en: a coffee / one coffee }
      - { word: un thé, en: a tea / one tea }
      - { word: de l'eau, en: water / some water }
      - { word: un croissant, en: a croissant }
      - { word: je voudrais, en: I would like }
      - { word: l'addition, en: the bill / the check }
      - { word: c'est combien, en: how much is it }
      - { word: avec, en: with }
      - { word: sans, en: without }
      - { word: du lait, en: milk / some milk }
      - { word: du sucre, en: sugar / some sugar }
      - { word: voilà, en: here you go / there you go / here it is }
    exercises:
      - type: choice
        prompt: How do you say "I would like"?
        options: ["Je voudrais", "Je suis", "J'ai", "Je vais"]
        answer: Je voudrais
      - type: match
        pairs:
          - [un café, a coffee]
          - [un thé, a tea]
          - [de l'eau, water]
          - [avec, with]
          - [sans, without]
      - type: word_bank
        prompt: I would like a coffee, please.
        answer: Je voudrais un café, s'il vous plaît.
        distractors: ["thé", "une"]
      - type: translate
        source: target
        prompt: Un thé sans sucre.
        answers: ["A tea without sugar", "One tea without sugar", "A tea with no sugar"]
      - type: gap
        prompt: Un café ___ du lait, s'il vous plaît.
        hint: A coffee with milk, please.
        answers: ["avec"]
        options: ["avec", "sans", "et"]
      - type: listen
        text: L'addition, s'il vous plaît.
      - type: translate
        source: en
        prompt: How much is it?
        answers: ["C'est combien ?", "Combien ça coûte ?", "Ça coûte combien ?", "Combien ?"]
      - type: choice
        prompt: The waiter puts down your cup and says « Voilà ! ». What does it mean?
        options: ["Here you go!", "Goodbye!", "Thank you!", "Excuse me!"]
        answer: Here you go!
      - type: translate
        source: en
        prompt: Water, please.
        answers: ["De l'eau, s'il vous plaît."]
      - type: word_bank
        prompt: The bill, please.
        answer: L'addition, s'il vous plaît.
        distractors: ["le", "merci"]
      - type: gap
        prompt: Je ___ un croissant.
        hint: I would like a croissant.
        answers: ["voudrais"]
        options: ["voudrais", "suis", "vais"]

  - id: nombres
    title: Les nombres 0–20
    intro: >-
      17, 18 and 19 are built from ten: dix-sept (10 + 7), dix-huit, dix-neuf.
      « Un » becomes « une » before a feminine noun: une banque.
    vocab:
      - { word: zéro, en: zero / 0 }
      - { word: un, en: one / 1 }
      - { word: deux, en: two / 2 }
      - { word: trois, en: three / 3 }
      - { word: quatre, en: four / 4 }
      - { word: cinq, en: five / 5 }
      - { word: six, en: six / 6 }
      - { word: sept, en: seven / 7 }
      - { word: huit, en: eight / 8 }
      - { word: neuf, en: nine / 9 }
      - { word: dix, en: ten / 10 }
      - { word: onze, en: eleven / 11 }
      - { word: douze, en: twelve / 12 }
      - { word: treize, en: thirteen / 13 }
      - { word: quatorze, en: fourteen / 14 }
      - { word: quinze, en: fifteen / 15 }
      - { word: seize, en: sixteen / 16 }
      - { word: dix-sept, en: seventeen / 17 }
      - { word: dix-huit, en: eighteen / 18 }
      - { word: dix-neuf, en: nineteen / 19 }
      - { word: vingt, en: twenty / 20 }
    exercises:
      - type: match
        pairs:
          - [un, one]
          - [deux, two]
          - [trois, three]
          - [quatre, four]
          - [cinq, five]
      - type: match
        pairs:
          - [sept, seven]
          - [huit, eight]
          - [neuf, nine]
          - [dix, ten]
          - [onze, eleven]
      - type: choice
        prompt: Which number is « douze »?
        speak: douze
        options: ["12", "2", "10", "20"]
        answer: "12"
      - type: listen
        text: quinze
      - type: translate
        source: en
        prompt: three
        answers: ["trois"]
      - type: choice
        prompt: cinq + quatre = ?
        options: ["neuf", "huit", "dix", "sept"]
        answer: neuf
      - type: listen
        text: dix-sept
      - type: translate
        source: target
        prompt: vingt
        answers: [twenty, "20"]
      - type: gap
        prompt: six, sept, ___, neuf
        hint: 6, 7, 8, 9
        answers: ["huit"]
      - type: choice
        prompt: How do you write 14?
        options: ["quatorze", "quarante", "quatre", "quinze"]
        answer: quatorze
      - type: translate
        source: en
        prompt: I would like two coffees.
        answers: ["Je voudrais deux cafés."]
      - type: listen
        text: seize

  - id: je-me-presente
    title: Je me présente
    intro: >-
      No article before a job: « je suis ingénieur », not « je suis un ingénieur ».
      Many adjectives add -e for women: suédois → suédoise, enchanté → enchantée.
    vocab:
      - { word: je m'appelle, en: my name is / I am called }
      - { word: je suis, en: I am }
      - { word: tu es, en: you are }
      - { word: il est, en: he is / it is }
      - { word: elle est, en: she is / it is }
      - { word: j'habite à, en: I live in }
      - { word: je viens de, en: I come from / I am from }
      - { word: suédois, en: Swedish }
      - { word: ingénieur, en: engineer / an engineer }
      - { word: enchanté, en: nice to meet you / pleased to meet you }
      - { word: comment tu t'appelles, en: what is your name }
      - { word: j'aime, en: I like / I love }
    exercises:
      - type: choice
        prompt: How do you say "my name is"?
        options: ["Je m'appelle", "J'habite", "Je suis", "Je viens"]
        answer: Je m'appelle
      - type: word_bank
        prompt: My name is Nils.
        answer: Je m'appelle Nils.
        distractors: ["suis", "tu"]
      - type: translate
        source: en
        prompt: I am Swedish.
        answers: ["Je suis suédois.", "Je suis suédoise."]
      - type: gap
        prompt: J'___ à Stockholm.
        hint: I live in Stockholm.
        answers: ["habite"]
      - type: listen
        text: Enchanté !
        also: ["Enchantée !"]
      - type: translate
        source: target
        prompt: Je viens de Suède.
        answers: ["I come from Sweden.", "I am from Sweden."]
      - type: match
        pairs:
          - [je suis, I am]
          - [tu es, you are]
          - [il est, he is]
          - [elle est, she is]
          - [j'aime, I like]
      - type: word_bank
        prompt: I am an engineer.
        answer: Je suis ingénieur.
        also: ["Je suis ingénieure."]
        distractors: ["un", "es"]
      - type: choice
        prompt: « Comment tu t'appelles ? » means…
        speak: Comment tu t'appelles ?
        options: ["What is your name?", "How are you?", "Where do you live?", "Where are you from?"]
        answer: What is your name?
      - type: translate
        source: en
        prompt: I like poker.
        answers: ["J'aime le poker."]
      - type: gap
        prompt: Elle ___ ingénieure.
        hint: She is an engineer.
        answers: ["est"]
        options: ["est", "es", "suis"]
      - type: listen
        text: Je m'appelle Nils et j'habite à Stockholm.

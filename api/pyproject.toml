[project]
name = "hub-api"
version = "0.1.0"
description = "API server for Blueberry Home"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn[standard]>=0.54",
    "sqlmodel>=0.0.48",
    "argon2-cffi>=25.1",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "fsrs>=6.3,<7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.14"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
